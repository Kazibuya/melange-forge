name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # mariadb exclu de la matrix auto (build trop long → workflow_dispatch dédié)
          services=$(ls -d APK/*/ | xargs -I{} basename {} \
            | grep -v mariadb \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> $GITHUB_OUTPUT

  build-apk:
    name: Build .apk — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: chainguard-dev/actions/setup-melange@main
        with:
          version: latest-release

      # Les healthcheck-* ont un binaire Go à compiler avant melange
      - name: Setup Go (healthcheck-* only)
        if: startsWith(matrix.service, 'healthcheck-')
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Go binary (healthcheck-* only)
        if: startsWith(matrix.service, 'healthcheck-')
        working-directory: APK/${{ matrix.service }}
        run: go build -o ${{ matrix.service }} .

      - name: Run melange
        working-directory: APK/${{ matrix.service }}
        run: |
          echo "${{ secrets.MELANGE_RSA_KEY }}" > $RUNNER_TEMP/melange-ci.rsa
          chmod 600 $RUNNER_TEMP/melange-ci.rsa
          melange build ${{ matrix.service }}.yaml \
            --arch amd64 \
            --signing-key $RUNNER_TEMP/melange-ci.rsa \
            --pipeline-dir ${{ github.workspace }}/pipelines

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: APK/${{ matrix.service }}/packages/x86_64/*.apk

  # ──────────────────────────────────────────
  # MARIADB — déclenché uniquement manuellement
  # ──────────────────────────────────────────
  build-mariadb:
    name: Build .apk — mariadb (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: chainguard-dev/actions/setup-melange@main
        with:
          version: latest-release

      - name: Run melange
        working-directory: APK/mariadb
        run: |
          echo "${{ secrets.MELANGE_RSA_KEY }}" > $RUNNER_TEMP/melange-ci.rsa
          chmod 600 $RUNNER_TEMP/melange-ci.rsa
          melange build mariadb.yaml \
            --arch amd64 \
            --signing-key $RUNNER_TEMP/melange-ci.rsa

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb
          path: APK/mariadb/packages/x86_64/*.apk

  build-issue-reporter:
    name: Build issue-reporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaire
        working-directory: issue-reporter
        run: go build -o issue-reporter .

      - name: Upload issue-reporter artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-reporter
          path: issue-reporter/issue-reporter

  release:
    needs: [build-apk, build-issue-reporter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all apk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - uses: chainguard-dev/actions/setup-melange@main
        with:
          version: latest-release

      - name: Generate global APKINDEX
        run: |
          mkdir -p dist/x86_64
          cp dist/**/*.apk dist/x86_64/
          echo "${{ secrets.MELANGE_RSA_KEY }}" > $RUNNER_TEMP/melange-ci.rsa
          chmod 600 $RUNNER_TEMP/melange-ci.rsa
          melange index \
            --signing-key $RUNNER_TEMP/melange-ci.rsa \
            --output dist/x86_64/APKINDEX.tar.gz \
            dist/x86_64/*.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/x86_64/APKINDEX.tar.gz
            dist/x86_64/*.apk
            dist/issue-reporter/issue-reporter
            melange-ci.rsa.pub

  publish-pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download all apk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Publish to GitHub Pages
        run: |
          mkdir -p x86_64
          cp dist/**/*.apk x86_64/
          curl -sL https://github.com/Kazibuya/melange-forge/releases/download/${{ github.ref_name }}/melange-ci.rsa.pub -o melange-ci.rsa.pub
          curl -sL https://github.com/Kazibuya/melange-forge/releases/download/${{ github.ref_name }}/APKINDEX.tar.gz -o x86_64/APKINDEX.tar.gz
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add x86_64/ melange-ci.rsa.pub
          git commit -m "release ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin gh-pages
