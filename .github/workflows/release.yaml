name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          services=$(ls -d APK/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> $GITHUB_OUTPUT

  build-apk:
    name: Build .apk
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: chainguard-dev/actions/setup-melange@main
        with:
          version: latest-release

      - name: Run melange
        working-directory: APK/${{ matrix.service }}
        run: |
          echo "${{ secrets.MELANGE_RSA_KEY }}" > $RUNNER_TEMP/melange-ci.rsa
          chmod 600 $RUNNER_TEMP/melange-ci.rsa
          melange build ${{ matrix.service }}.yaml --arch amd64 --signing-key $RUNNER_TEMP/melange-ci.rsa

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: APK/${{ matrix.service }}/packages/x86_64/*.apk

  build-issue-reporter:
    name: Build issue-reporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binairie
        working-directory: issue-reporter
        run: go build -o issue-reporter .

      - name: Upload issue-reporter artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-reporter
          path: issue-reporter/issue-reporter

  release:
      needs: [build-apk, build-issue-reporter]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Download all apk artifacts
          uses: actions/download-artifact@v4
          with:
            path: dist/

        - uses: chainguard-dev/actions/setup-melange@main
          with:
            version: latest-release

        - name: Generate global APKINDEX
          run: |
            mkdir -p dist/x86_64
            cp dist/**/*.apk dist/x86_64/
            echo "${{ secrets.MELANGE_RSA_KEY }}" > $RUNNER_TEMP/melange-ci.rsa
            chmod 600 $RUNNER_TEMP/melange-ci.rsa
            melange index --signing-key $RUNNER_TEMP/melange-ci.rsa dist/x86_64/

        - name: Create release
          uses: softprops/action-gh-release@v2
          with:
            files: |
              dist/x86_64/APKINDEX.tar.gz
              dist/**/*.apk
              dist/issue-reporter/issue-reporter
              melange-ci.rsa.pub
